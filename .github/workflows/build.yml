name: Windows build and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Run deterministic editor and lifecycle regressions
        run: dotnet run --project tests/NPPAI.Smoke -c Release -- --lifecycle
      - name: Build native plugin package
        shell: pwsh
        run: ./scripts/Build.ps1 -CodeOnly
      - name: Verify bundled .NET hosting from a native process
        shell: pwsh
        run: ./scripts/Test-NativePackage.ps1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: NPPAI-win-x64-code-only
          path: artifacts/NPPAI/
          if-no-files-found: error
          retention-days: 7
